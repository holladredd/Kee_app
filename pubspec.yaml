name: kee
description: "Kee - Android-first personal memory and task assistant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Local Persistence & Offline-First
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0

  # Date, Time & ID Utilities
  intl: ^0.20.2
  uuid: ^4.6.0
  timezone: ^0.11.2

  # Local Notifications (Offline reminders)
  flutter_local_notifications: ^23.0.3

  # Voice & Input
  speech_to_text: ^7.5.0

  # Attachments & Files
  file_picker: ^13.4.0
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  share_plus: ^13.3.1

  # Networking (Optional sync with backend)
  http: ^1.6.0
  sqflite_common_ffi_web: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
