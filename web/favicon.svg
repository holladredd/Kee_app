<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Premium Obsidian Canvas with Squircle Geometry -->
  <rect width="512" height="512" rx="128" fill="#080A0C"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#1C2127" stroke-width="2"/>

  <!-- High-End Minimalist Monogram: Interlocking Architectural 'K' + 'e' -->
  <g fill="none" stroke="#F1F3F5" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Pillar of K -->
    <line x1="156" y1="116" x2="156" y2="396"/>

    <!-- Upper Razor Diagonal of K -->
    <line x1="178" y1="236" x2="336" y2="116"/>

    <!-- Integrated Precision Lowercase 'e' forming lower wing of K -->
    <!-- Horizontal Crossbar of 'e' extending from junction -->
    <line x1="186" y1="256" x2="350" y2="256"/>

    <!-- Circular Loop and Arc of 'e' -->
    <path d="M 350 256
             C 350 200 310 186 268 186
             C 214 186 186 230 186 288
             C 186 352 222 396 288 396
             C 334 396 364 366 376 338"/>
  </g>

  <!-- Premium Accent Pip: Platinum core accent -->
  <circle cx="268" cy="221" r="7" fill="#F1F3F5"/>
</svg>
